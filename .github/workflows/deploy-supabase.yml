# Deploys the backend when main changes under supabase/: new database
# migrations (supabase db push), then the edge functions. It needs three
# repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    the project ref: the xyz in https://xyz.supabase.co
# Without them it does nothing. The Ollama key is already a secret of the
# functions on Supabase and is not needed here.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - supabase/functions/**
      - supabase/config.toml
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Skip without secrets
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == '' || env.SUPABASE_PROJECT_ID == ''
        run: echo "::notice::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID as repository secrets to deploy the backend."

      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_ID != ''

      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_ID != ''
        with:
          version: 2.121.0

      - name: Apply new migrations
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_ID != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --yes

      - name: Deploy the edge functions
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' && env.SUPABASE_PROJECT_ID != ''
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
