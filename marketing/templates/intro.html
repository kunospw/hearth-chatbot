<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#s{width:1080px;height:1920px;position:relative;background:radial-gradient(900px 900px at 50% 48%,#2a1820,transparent 70%),#131214}
#flame{position:absolute;left:340px;top:560px;width:400px;height:400px;transform-origin:50% 90%}
#word{position:absolute;left:0;right:0;top:1010px;text-align:center;font-family:'Newsreader',serif;font-size:132px;font-weight:500}
#tag{position:absolute;left:100px;right:100px;top:1200px;text-align:center;font-family:'Newsreader',serif;font-size:56px;line-height:1.3;color:#B3AAA3;font-style:italic}
#tag b{color:#E9A0AE;font-weight:500}
#cta{position:absolute;left:0;right:0;top:1480px;text-align:center;font-weight:600;font-size:34px;letter-spacing:.16em;text-transform:uppercase;color:#E9A0AE}
.sp{position:absolute;width:10px;height:10px;border-radius:50%;background:#E9A0AE}
</style>
<div id="s">
<svg id="flame" viewBox="0 0 512 512"><path id="outer" d="M256 56 C300 120 392 190 392 300 C392 376 332 440 256 440 C180 440 120 376 120 300 C120 236 160 196 188 164 C196 196 214 212 226 214 C214 150 232 100 256 56 Z" fill="#9A3349"/><path id="inner" d="M256 250 C282 286 320 310 320 356 C320 394 292 420 256 420 C220 420 192 394 192 356 C192 320 226 296 256 250 Z" fill="#E9A0AE"/></svg>
<div id="word">Hearth</div><div id="tag"></div><div id="cta">Early access · link in bio</div>
</div>
<script>
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3), clamp=(x)=>Math.min(1,Math.max(0,x));
const TAG='Write the story <b>only you</b> can.';
const plain='Write the story only you can.';
const sparks=[...Array(14)].map((_,i)=>{const e=document.createElement('div');e.className='sp';document.getElementById('s').appendChild(e);return e;});
window.setT=function(t){
  const f=document.getElementById('flame');
  const a=ease(t/1.2);
  const flick=1+0.015*Math.sin(t*9)+0.01*Math.sin(t*17);
  f.style.opacity=a; f.style.transform=`translateY(${(1-a)*60}px) scale(${(0.7+0.3*a)*flick},${(0.7+0.3*a)*(flick+0.01*Math.sin(t*11))})`;
  document.getElementById('inner').style.opacity=0.75+0.25*Math.sin(t*7);
  const w=document.getElementById('word'); const wa=ease((t-1.1)/0.9); w.style.opacity=wa; w.style.transform=`translateY(${(1-wa)*30}px)`;
  // typewriter
  const n=Math.floor(clamp((t-2.2)/2.6)*plain.length);
  let out='',cnt=0,inB=false; 
  for(const part of TAG.split(/(<b>|<\/b>)/)){ if(part==='<b>'){out+='<b>';inB=true;continue;} if(part==='</b>'){out+='</b>';inB=false;continue;}
    const take=Math.max(0,Math.min(part.length,n-cnt)); out+=part.slice(0,take); cnt+=part.length; }
  document.getElementById('tag').innerHTML=out+(inB?'':'')+(n<plain.length&&t>2.2?'<span style="color:#E9A0AE">|</span>':'');
  const c=document.getElementById('cta'); const ca=ease((t-5.4)/0.8); c.style.opacity=ca; c.style.transform=`translateY(${(1-ca)*20}px)`;
  sparks.forEach((e,i)=>{const life=(t*0.5+i/14)%1; const x=540+Math.sin(i*2.1+t)*70+(i%5-2)*18; const y=640-life*420; e.style.left=x+'px'; e.style.top=y+'px';
    e.style.opacity=a*(1-life)*0.8*(i%3?0.6:1); e.style.transform=`scale(${0.5+(1-life)*0.9})`;});
};
setT(0);
</script>
