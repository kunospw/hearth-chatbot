name: hearth
description: "Hearth — mobile-first AI character roleplay."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  image_picker: ^1.2.4
  supabase_flutter: ^2.18.3
  http: ^1.6.0
  fetch_client: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/portraits/
    - assets/brand/hearth_mark.svg
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
        - asset: assets/fonts/Figtree-Italic.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#131214"
  adaptive_icon_foreground: assets/brand/icon_fg.png
